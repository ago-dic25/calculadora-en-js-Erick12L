<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="entrada">
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
  </div>

  <div class="operaciones">
    <button onclick="calculadora('+')" class="operador" id="suma">+</button>
    <button onclick="calculadora('-')" class = "operador" id="resta">-</button>
    <button onclick="calculadora('x')" class = "operador" id="multiplicacion">x</button>
    <button onclick="calculadora('/')" class = "operador" id="division">÷</button>
    <button onclick ="calculadora('boton-limpiar')" class = "operador" id="limpiar">Limpiar</button>
  </div>
  <div class="resultado">
    <h2>Resultado: <span id="resultado"></span></h2>
  </div>
  <div class ="historial">
    <h3>Historial de Operaciones:</h3>
    <ul id="historial-lista"></ul>
  </div>

  <script src="index.js"></script>
</body>
</html>
